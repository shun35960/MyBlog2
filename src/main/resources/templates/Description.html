<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title th:text="${description.title}"></title>
</head>
<body>
<section layout:fragment="content">
    <h1 class="display-3" th:text="${description.title}">記事タイトル</h1>
    <p class="text-muted" th:text="${#dates.format(description.createdAt, 'yyyy-MM-dd HH:mm')}"></p>

    <div class="action-buttons">
        <a th:href="@{/Hello}" class="btn btn-tonal">記事一覧へ戻る</a>
        <form th:action="@{/Hello/Edit/{id}(id=${description.id})}">
            <button type="submit" class="btn btn-primary">記事を編集</button>
        </form>
        <form th:action="@{/Hello/{id}(id=${description.id})}"
              th:method="delete"
              onsubmit="return confirm('記事を削除しますか？')">
            <button type="submit" class="btn btn-danger">記事を削除</button>
        </form>
    </div>

    <div class="article-content" th:utext="${renderedHtmlContent}"></div>
</section>
</body>
</html>
