<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title th:text="${description.title}">記事詳細</title>
</head>
<body>
<section layout:fragment="content">
    <div class="reading-progress" aria-hidden="true"></div>
    <div th:replace="~{layout/layout :: adminBar('')}"></div>

    <div class="reading-container">
        <header class="page-header">
            <nav class="breadcrumb-nav" aria-label="パンくずリスト">
                <ol class="breadcrumb-list">
                    <li><span>管理</span></li>
                    <li><a th:href="@{/Hello}">記事一覧</a></li>
                    <li aria-current="page">記事詳細</li>
                </ol>
            </nav>

            <h1 class="page-title" th:text="${description.title}">記事タイトル</h1>

            <div class="meta-row">
                <time class="meta-date"
                      th:if="${description.createdAt != null}"
                      th:attr="datetime=${#dates.format(description.createdAt, 'yyyy-MM-dd''T''HH:mm')}"
                      th:text="${#dates.format(description.createdAt, 'yyyy-MM-dd HH:mm')}"></time>
                <span th:if="${description.published}" class="status-pill status-pill--published">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span>公開中</span>
                </span>
                <span th:unless="${description.published}" class="status-pill status-pill--draft">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span>下書き</span>
                </span>
                <a th:if="${description.published}"
                   th:href="@{/ViewDescription/{id}(id=${description.id})}"
                   class="chip">公開ページを見る</a>
            </div>

            <div class="action-bar">
                <a class="btn btn-primary" th:href="@{/Hello/Edit/{id}(id=${description.id})}">記事を編集</a>
                <form th:action="@{/Hello/{id}(id=${description.id})}"
                      th:method="delete"
                      class="inline-form"
                      data-confirm="記事を削除しますか？"
                      data-confirm-detail="削除した記事は元に戻せません。">
                    <button type="submit" class="btn btn-danger-soft">記事を削除</button>
                </form>
                <a class="btn btn-ghost" th:href="@{/Hello}">一覧へ戻る</a>
            </div>
        </header>

        <article class="article-surface">
            <div class="article-content" th:utext="${renderedHtmlContent}"></div>
        </article>
    </div>
</section>
</body>
</html>
