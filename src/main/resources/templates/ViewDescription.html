<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <!-- Google tag / AdSense は layout.html の head で読み込む -->
    <title th:text="${article.title}"></title>
</head>
<body>
<section layout:fragment="content">
    <h1 class="display-3" th:text="${article.title}">記事タイトル</h1>
    <p class="text-muted" th:text="${#dates.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></p>
    <div class="article-content" th:utext="${renderedHtmlContent}"></div>
    <div class="action-buttons">
        <a th:href="@{/}" class="btn btn-tonal">トップページへ戻る</a>
    </div>
</section>
</body>
</html>
