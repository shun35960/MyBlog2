<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>記事詳細</title>
</head>
<body>
<section layout:fragment="content">
    <h2 th:text="${article.title}"></h2>
    <div class="article-content" th:utext="${renderedHtmlContent}"></div>
    <p class="text-muted" th:text="${#dates.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></p>
</section>
</body>
</html>
