<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>下書き一覧</title>
</head>
<body>
<section layout:fragment="content">
    <h1 class="display-3" th:text="${Drafttitle}"></h1>
    <div class="action-buttons">
        <a th:href="@{/Hello/Edit}" class="btn btn-primary">新規作成</a>
        <a th:href="@{/Hello}" class="btn btn-tonal">公開記事一覧</a>
    </div>
    <div class="row" th:if="${drafts != null and !drafts.empty}">
        <div th:each="article : ${drafts}">
            <div class="col">
                <article class="card">
                    <h2 class="card-title" th:text="${article.title}">タイトル</h2>
                    <div>
                        <a th:href="@{/Hello/Description/{id}(id=${article.id})}" class="card-link">詳細</a>
                    </div>
                </article>
            </div>
        </div>
    </div>
    <div class="md-empty-state" th:unless="${drafts != null and !drafts.empty}">
        <p>記事はありません。</p>
    </div>
</section>
</body>
</html>
