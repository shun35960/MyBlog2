<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>下書き一覧</title>
</head>
<body>
<section layout:fragment="content">
    <p class="display-3 mb-4" th:text="${Drafttitle}"></p>
    <div class="action-buttons">
        <a th:href="@{/Hello/Edit}" class="btn">新規作成</a>
        <a th:href="@{/Hello}" class="btn">公開記事一覧</a>
    </div>
    <div class="row" th:if="${drafts != null and !drafts.empty}">
        <div th:each="article : ${drafts}">
            <div class="col">
                <div class="card">
                    <h5 class="card-title" th:text="${article.title}">タイトル</h5>
                    <div>
                        <a th:href="@{/Hello/Description/{id}(id=${article.id})}" class="card-link">詳細</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:unless="${drafts != null and !drafts.empty}">
        <p>記事はありません。</p>
    </div>
</section>
</body>
</html>
