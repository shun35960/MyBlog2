<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title th:text="${series.title}">シリーズ詳細</title>
</head>
<body>
<section layout:fragment="content">
    <div class="reading-progress" aria-hidden="true"></div>

    <div class="reading-container">
        <header class="page-header">
            <nav class="breadcrumb-nav" aria-label="パンくずリスト">
                <ol class="breadcrumb-list">
                    <li><a th:href="@{/}">トップ</a></li>
                    <li><a th:href="@{/Series}">シリーズ</a></li>
                    <li aria-current="page" th:text="${series.title}">シリーズ名</li>
                </ol>
            </nav>
            <h1 class="page-title" th:text="${series.title}">シリーズ名</h1>
            <div class="meta-row">
                <span class="chip-static"
                      th:if="${articleViews != null}"
                      th:text="|${#lists.size(articleViews)} 記事|">0 記事</span>
                <time class="meta-date"
                      th:if="${series.createdAt != null}"
                      th:attr="datetime=${#dates.format(series.createdAt, 'yyyy-MM-dd''T''HH:mm')}"
                      th:text="${#dates.format(series.createdAt, 'yyyy-MM-dd HH:mm')}"></time>
            </div>
            <div class="action-bar">
                <a th:href="@{/Series}" class="btn btn-ghost">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m12 19-7-7 7-7"></path>
                        <path d="M19 12H5"></path>
                    </svg>
                    <span>シリーズ一覧へ戻る</span>
                </a>
            </div>
        </header>

        <div class="article-surface" style="margin-block-end: 1.5rem;"
             th:if="${renderedDescription != null and !renderedDescription.isEmpty()}">
            <div class="article-content" th:utext="${renderedDescription}"></div>
        </div>

        <!-- 所属する公開記事を作成日時順に連結表示 -->
        <th:block th:if="${articleViews != null and !articleViews.empty}">
            <nav class="series-toc" aria-label="シリーズの目次">
                <h2 class="series-toc-title">CONTENTS</h2>
                <ol class="series-toc-list">
                    <li th:each="view, iterStat : ${articleViews}">
                        <a class="series-toc-link" th:href="|#article-${iterStat.count}|">
                            <span class="series-toc-num"
                                  th:text="${iterStat.count < 10 ? '0' + iterStat.count : iterStat.count}">01</span>
                            <span th:text="${view.article.title}">記事タイトル</span>
                        </a>
                    </li>
                </ol>
            </nav>

            <div class="series-entries">
                <article class="series-article-entry"
                         th:each="view, iterStat : ${articleViews}"
                         th:id="|article-${iterStat.count}|">
                    <header class="series-article-header">
                        <div>
                            <span class="series-article-kicker"
                                  th:text="|PART ${iterStat.count < 10 ? '0' + iterStat.count : iterStat.count}|">PART 01</span>
                            <h2 class="series-article-title">
                                <a th:href="@{/ViewDescription/{id}(id=${view.article.id})}"
                                   th:text="${view.article.title}">記事タイトル</a>
                            </h2>
                        </div>
                        <time class="meta-date"
                              th:if="${view.article.createdAt != null}"
                              th:attr="datetime=${#dates.format(view.article.createdAt, 'yyyy-MM-dd''T''HH:mm')}"
                              th:text="${#dates.format(view.article.createdAt, 'yyyy-MM-dd HH:mm')}"></time>
                    </header>
                    <div class="article-content" th:utext="${view.html}"></div>
                </article>
            </div>
        </th:block>

        <div class="empty-state" th:unless="${articleViews != null and !articleViews.empty}">
            <span class="empty-state-icon" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path>
                    <path d="M14 2v4a2 2 0 0 0 2 2h4"></path>
                    <path d="M10 9H8"></path>
                    <path d="M16 13H8"></path>
                    <path d="M16 17H8"></path>
                </svg>
            </span>
            <p class="empty-state-title">このシリーズに公開記事はありません</p>
            <p class="empty-state-text">記事が公開されると、このページに順番に表示されます。</p>
        </div>
    </div>
</section>
</body>
</html>
