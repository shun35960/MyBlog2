<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title th:text="${series.title}"></title>
</head>
<body>
<section layout:fragment="content">
    <h1 class="display-3" th:text="${series.title}">シリーズ名</h1>
    <div class="article-content" th:if="${renderedDescription != null and !renderedDescription.isEmpty()}"
         th:utext="${renderedDescription}"></div>

    <div class="action-buttons">
        <a th:href="@{/Series}" class="btn btn-tonal">シリーズ一覧へ戻る</a>
    </div>

    <!-- 所属する公開記事を作成日時順に連結表示 -->
    <div th:if="${articleViews != null and !articleViews.empty}">
        <article th:each="view : ${articleViews}">
            <hr class="md-divider">
            <h2>
                <a th:href="@{/ViewDescription/{id}(id=${view.article.id})}"
                   th:text="${view.article.title}">記事タイトル</a>
            </h2>
            <p class="text-muted" th:text="${#dates.format(view.article.createdAt, 'yyyy-MM-dd HH:mm')}"></p>
            <div class="article-content" th:utext="${view.html}"></div>
        </article>
    </div>
    <div class="md-empty-state" th:unless="${articleViews != null and !articleViews.empty}">
        <p>このシリーズに公開記事はありません。</p>
    </div>
</section>
</body>
</html>
