<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>login</title>
</head>
<body>
<h1>ログイン</h1>
<section layout:fragment="content">
    <form th:action="@{/authenticate}" method="post">
        <div class="form-floating mt-3">
            <input type="text" id="floatlngInput" name="username" class="form-control" placeholder="ユーザー名"
                   required>
            <label for="floatlngInput" class="form-label">ユーザー名</label>
        </div>
        <div class="form-floating mt-3">
            <input type="password" id="floatingPassword" name="password" class="form-control" placeholder="パスワード"
                   required>
            <label for="floatingPassword" class="form-label">パスワード</label>
        </div>
        <p class="mt-3" th:text="${errormessage}"></p>
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">ログイン</button>
        </div>
    </form>
</section>
</body>
</html>
