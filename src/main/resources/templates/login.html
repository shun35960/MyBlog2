<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>login</title>
</head>
<body>
<section layout:fragment="content">
    <div class="md-form-surface md-auth-card">
        <h1 class="md-headline-small">ログイン</h1>
        <form th:action="@{/authenticate}" method="post">
            <div class="form-floating">
                <input type="text" id="floatlngInput" name="username" class="form-control" placeholder="ユーザー名"
                       autocomplete="username" required>
                <label for="floatlngInput">ユーザー名</label>
            </div>
            <div class="form-floating">
                <input type="password" id="floatingPassword" name="password" class="form-control" placeholder="パスワード"
                       autocomplete="current-password" required>
                <label for="floatingPassword">パスワード</label>
            </div>
            <p class="md-error-text" th:if="${errormessage != null}" th:text="${errormessage}"></p>
            <div class="action-buttons">
                <button type="submit" class="btn btn-primary">ログイン</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
