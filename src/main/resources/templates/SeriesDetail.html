<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title th:text="${series.title}"></title>
</head>
<body>
<section layout:fragment="content">
    <p class="display-3 mb-2" th:text="${series.title}">シリーズ名</p>
    <div class="article-content mb-4" th:if="${renderedDescription != null and !renderedDescription.isEmpty()}"
         th:utext="${renderedDescription}"></div>

    <div class="action-buttons">
        <a th:href="@{/Hello/Series}" class="btn">シリーズ一覧へ戻る</a>
        <form th:action="@{/Hello/Series/{id}(id=${series.id})}"
              th:method="delete"
              style="display:inline;"
              onsubmit="return confirm('シリーズを削除しますか？(記事は削除されません)')">
            <button type="submit" class="btn btn-danger">シリーズを削除</button>
        </form>
    </div>

    <!-- シリーズ名・説明の編集フォーム -->
    <details class="mb-4">
        <summary>シリーズ情報を編集</summary>
        <form class="edit-form" th:action="@{/Hello/Series/{id}(id=${series.id})}" method="post">
            <div class="form-group">
                <label for="title">シリーズ名</label>
                <input class="form-control" type="text" id="title" name="title" th:value="${series.title}" required>
            </div>
            <div class="form-group">
                <label for="description">説明(Markdown可)</label>
                <textarea class="form-control" id="description" name="description" rows="5"
                          th:text="${series.description}"></textarea>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">更新</button>
            </div>
        </form>
    </details>

    <!-- 所属する公開記事を作成日時順に連結表示 -->
    <div th:if="${articleViews != null and !articleViews.empty}">
        <article class="mb-5" th:each="view : ${articleViews}">
            <hr>
            <h2>
                <a th:href="@{/Hello/Description/{id}(id=${view.article.id})}"
                   th:text="${view.article.title}">記事タイトル</a>
            </h2>
            <p class="text-muted" th:text="${#dates.format(view.article.createdAt, 'yyyy-MM-dd HH:mm')}"></p>
            <div class="article-content" th:utext="${view.html}"></div>
        </article>
    </div>
    <div th:unless="${articleViews != null and !articleViews.empty}">
        <p>このシリーズに公開記事はありません。</p>
    </div>
</section>
</body>
</html>
