<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title th:text="${article.id != null} ? '記事を編集' : '記事を作成'">記事を編集</title>
</head>
<body>
<section layout:fragment="content">
    <div th:replace="~{layout/layout :: adminBar('edit')}"></div>

    <header class="page-header">
        <nav class="breadcrumb-nav" aria-label="パンくずリスト">
            <ol class="breadcrumb-list">
                <li><span>管理</span></li>
                <li><a th:href="@{/Hello}">記事一覧</a></li>
                <li aria-current="page" th:text="${article.id != null} ? '記事を編集' : '記事を作成'">記事を作成</li>
            </ol>
        </nav>
        <h1 class="page-title" th:text="${article.id != null} ? '記事を編集' : '記事を作成'">記事を作成</h1>
    </header>

    <form th:action="${article.id != null} ? @{/Hello/Submit/{id}(id=${article.id})} : @{/Hello/Submit}"
          th:object="${article}"
          th:method="${article.id != null} ? put : post">
        <div class="editor-layout">
            <div class="editor-main">
                <div class="field">
                    <label for="title" class="field-label">記事のタイトル</label>
                    <span id="titleHint" class="field-hint">最大200文字</span>
                    <input type="text"
                           id="title"
                           th:field="*{title}"
                           class="field-control"
                           maxlength="200"
                           required
                           aria-describedby="titleHint"
                           data-error="titleError"
                           placeholder="記事のタイトルを入力">
                    <p id="titleError" class="field-error">タイトルを入力してください</p>
                </div>

                <div class="field">
                    <label for="content" class="field-label">本文（Markdown）</label>
                    <span id="contentHint" class="field-hint">GFM（テーブル・打ち消し線・コードブロック）対応</span>
                    <textarea id="content"
                              th:field="*{content}"
                              class="field-control field-control--editor"
                              rows="18"
                              required
                              aria-describedby="contentHint"
                              data-error="contentError"
                              placeholder="Markdown で記事を書く..."></textarea>
                    <p id="contentError" class="field-error">本文を入力してください</p>
                </div>

                <div class="editor-submit-bar">
                    <a class="btn btn-ghost" th:href="@{/Hello}">一覧へ戻る</a>
                    <button type="submit" class="btn btn-primary"
                            th:text="${article.id != null} ? '更新する' : '登録する'">登録する</button>
                </div>
            </div>

            <aside class="editor-sidebar" aria-label="記事設定">
                <!-- 公開設定パネル -->
                <div class="editor-panel">
                    <h2 id="publishSettingTitle" class="editor-panel-title">公開設定</h2>
                    <div class="choice-grid" role="radiogroup" aria-labelledby="publishSettingTitle">
                        <label class="choice-card" for="publish">
                            <input type="radio" id="publish" th:field="*{published}" th:value="true">
                            <span>
                                <span class="choice-card-title">公開</span>
                                <span class="choice-card-desc">ブログに表示</span>
                            </span>
                        </label>
                        <label class="choice-card" for="draft">
                            <input type="radio" id="draft" th:field="*{published}" th:value="false">
                            <span>
                                <span class="choice-card-title">下書き</span>
                                <span class="choice-card-desc">管理画面のみ</span>
                            </span>
                        </label>
                    </div>
                </div>

                <!-- シリーズパネル -->
                <div class="editor-panel">
                    <h2 class="editor-panel-title">シリーズ</h2>
                    <div class="field">
                        <label for="seriesId" class="field-label">所属シリーズ</label>
                        <select id="seriesId" th:field="*{seriesId}" class="field-control">
                            <option value="">なし</option>
                            <option th:each="series : ${seriesList}"
                                    th:value="${series.id}"
                                    th:text="${series.title}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="newSeriesTitle" class="field-label">新規シリーズ名</label>
                        <span id="newSeriesHint" class="field-hint">入力すると新しいシリーズを作成して割り当てます</span>
                        <input type="text"
                               id="newSeriesTitle"
                               name="newSeriesTitle"
                               maxlength="200"
                               class="field-control"
                               aria-describedby="newSeriesHint"
                               placeholder="新規シリーズ名">
                    </div>
                </div>

                <!-- 画像アップロードパネル -->
                <div class="editor-panel">
                    <h2 class="editor-panel-title">画像アップロード</h2>
                    <div id="dropZone" class="drop-zone">
                        <p class="drop-zone-text">ここに画像をドラッグ&amp;ドロップ</p>
                        <button type="button" class="btn btn-secondary btn-sm" id="uploadButton">
                            ファイルを選択
                        </button>
                        <input type="file"
                               id="imageFile"
                               accept="image/jpeg,image/png,image/gif,image/webp"
                               class="visually-hidden">
                        <p class="drop-zone-meta">JPEG / PNG / GIF / WebP・最大 100MB</p>
                    </div>

                    <div id="uploadStatus" class="upload-status" style="display: none;" aria-live="polite">
                        <div id="statusText" class="field-hint"></div>
                        <div class="progress">
                            <div id="progressBar" class="progress-bar" role="progressbar"
                                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
                                 style="width: 0%;"></div>
                        </div>
                    </div>

                    <div id="uploadError" class="alert alert-error upload-status" role="alert" hidden
                         style="display: none;"></div>

                    <p id="imageNotice" class="image-notice" role="status"></p>

                    <div id="uploadedImages" class="uploaded-images"></div>
                </div>
            </aside>
        </div>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // DOM 要素の取得
            const dropZone = document.getElementById('dropZone');
            const uploadButton = document.getElementById('uploadButton');
            const imageFile = document.getElementById('imageFile');
            const contentTextarea = document.getElementById('content');
            const uploadStatus = document.getElementById('uploadStatus');
            const uploadError = document.getElementById('uploadError');
            const imageNotice = document.getElementById('imageNotice');
            const statusText = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');
            const uploadedImages = document.getElementById('uploadedImages');

            // null チェック
            if (!uploadButton || !imageFile || !dropZone) {
                console.error('Required DOM elements not found');
                return;
            }

            let statusHideTimer = null;
            let errorHideTimer = null;

            // ファイル選択ボタンのイベントリスナー
            uploadButton.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                imageFile.click();
            });

            // ドロップゾーン自体のクリックでもファイル選択を開く
            dropZone.addEventListener('click', (e) => {
                if (e.target === imageFile || e.target === uploadButton || uploadButton.contains(e.target)) {
                    return;
                }
                imageFile.click();
            });

            // ファイル選択時のイベント
            imageFile.addEventListener('change', (e) => {
                handleFileSelect(e.target.files[0]);
            });

            // ドラッグオーバー時のイベント
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            });

            // ドラッグアウト時のイベント
            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            });

            // ドロップ時のイベント
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFileSelect(files[0]);
                }
            });

            // ファイル選択時の処理
            function handleFileSelect(file) {
                clearError();

                // ファイルの検証
                if (!file) {
                    showError('ファイルが選択されていません');
                    return;
                }

                // ファイル形式の検証
                const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
                if (!allowedTypes.includes(file.type)) {
                    showError('対応していないファイル形式です。JPEG, PNG, GIF, WebP のみアップロード可能です。');
                    imageFile.value = '';
                    return;
                }

                // ファイルサイズの検証（100MB 以下）
                const maxSize = 100 * 1024 * 1024;
                if (file.size > maxSize) {
                    showError('ファイルサイズが大きすぎます。最大100MBのファイルのみアップロード可能です。');
                    imageFile.value = '';
                    return;
                }

                // アップロード処理
                uploadImage(file);
            }

            // 画像アップロード処理
            function uploadImage(file) {
                const formData = new FormData();
                formData.append('file', file);

                clearTimeout(statusHideTimer);
                clearError();

                // アップロード状態を表示
                uploadStatus.style.display = 'block';
                statusText.textContent = 'アップロード中...';
                progressBar.style.width = '0%';
                progressBar.setAttribute('aria-valuenow', '0');

                // XMLHttpRequest で POST リクエスト送信
                const xhr = new XMLHttpRequest();

                // 進捗イベント
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = (e.loaded / e.total) * 100;
                        progressBar.style.width = percentComplete + '%';
                        progressBar.setAttribute('aria-valuenow', String(Math.round(percentComplete)));
                    }
                });

                // 完了時のイベント
                xhr.addEventListener('load', () => {
                    if (xhr.status === 200 || xhr.status === 201) {
                        try {
                            const response = JSON.parse(xhr.responseText);
                            if (response.fileId) {
                                // 画像を textarea に Markdown 形式で挿入
                                insertImageMarkdown(response.fileId, file.name);
                                statusText.textContent = 'アップロード完了しました！';
                                progressBar.style.width = '100%';
                                progressBar.setAttribute('aria-valuenow', '100');

                                // 3 秒後にステータスを非表示
                                statusHideTimer = setTimeout(() => {
                                    uploadStatus.style.display = 'none';
                                }, 3000);

                                // ファイル入力をリセット
                                imageFile.value = '';
                            } else {
                                showError('アップロードに失敗しました。ファイルIDが取得できません。');
                            }
                        } catch (e) {
                            showError('レスポンスのパースに失敗しました。');
                        }
                    } else {
                        let errorMessage = 'アップロードに失敗しました。';
                        try {
                            const response = JSON.parse(xhr.responseText);
                            if (response.message) {
                                errorMessage = response.message;
                            } else if (response.error) {
                                errorMessage = response.error;
                            }
                        } catch (e) {
                            // パースに失敗した場合はデフォルトメッセージを使用
                        }
                        showError(errorMessage);
                    }
                });

                // エラー時のイベント
                xhr.addEventListener('error', () => {
                    showError('ネットワークエラーが発生しました。');
                });

                // アボート時のイベント
                xhr.addEventListener('abort', () => {
                    showError('アップロードがキャンセルされました。');
                });

                // CSRF トークンを取得
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';

                // リクエスト送信
                xhr.open('POST', '/api/images/upload');
                if (csrfToken && csrfHeader) {
                    xhr.setRequestHeader(csrfHeader, csrfToken);
                }
                xhr.send(formData);
            }

            // Markdown 形式で画像を textarea に挿入
            function insertImageMarkdown(fileId, fileName) {
                const imageUrl = `/api/images/${fileId}`;
                const altText = fileName.replace(/\.[^.]+$/, '');
                const markdown = `![${altText}](${imageUrl})\n`;

                // textarea の現在のカーソル位置を取得
                const textarea = contentTextarea;
                const startPos = textarea.selectionStart;
                const endPos = textarea.selectionEnd;
                const textBefore = textarea.value.substring(0, startPos);
                const textAfter = textarea.value.substring(endPos);

                // Markdown をカーソル位置に挿入
                textarea.value = textBefore + markdown + textAfter;

                // カーソル位置を更新
                const newCursorPos = startPos + markdown.length;
                textarea.selectionStart = newCursorPos;
                textarea.selectionEnd = newCursorPos;
                textarea.focus();

                // アップロード済み画像情報を表示
                displayUploadedImage(fileId, altText, imageUrl);
            }

            // アップロード済み画像情報を表示
            function displayUploadedImage(fileId, altText, imageUrl) {
                const imageInfo = document.createElement('div');
                imageInfo.className = 'uploaded-image-item';

                // ファイル名はユーザー入力なので HTML として解釈させず textContent で入れる
                const label = document.createElement('strong');
                label.textContent = 'アップロード済み:';
                const captionWrapper = document.createElement('div');
                captionWrapper.className = 'uploaded-image-meta';
                captionWrapper.append(label, ' ', altText);

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'btn btn-danger-soft btn-sm delete-image-btn';
                deleteButton.dataset.fileId = fileId;
                deleteButton.textContent = '削除';
                deleteButton.addEventListener('click', () => {
                    deleteImage(fileId, imageInfo);
                });

                imageInfo.append(captionWrapper, deleteButton);
                uploadedImages.appendChild(imageInfo);
            }

            // 画像削除処理
            async function deleteImage(fileId, element) {
                const confirmed = await confirmDialog('この画像を削除しますか？', {
                    detail: 'MongoDB から画像を削除します。本文中の Markdown は自動では消えません。'
                });
                if (!confirmed) {
                    return;
                }

                // CSRF トークンを取得
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';

                const headers = {
                    'Content-Type': 'application/json'
                };
                if (csrfToken && csrfHeader) {
                    headers[csrfHeader] = csrfToken;
                }

                fetch(`/api/images/${fileId}`, {
                    method: 'DELETE',
                    headers: headers
                })
                .then(response => {
                    if (response.ok) {
                        element.remove();
                        // textarea からもマークダウンを削除するよう促す (alert() の代わりにページ内で知らせる)
                        imageNotice.textContent = '画像を削除しました。本文中の Markdown は手動で削除してください。';
                    } else {
                        showError('画像の削除に失敗しました。');
                    }
                })
                .catch(error => {
                    showError('エラーが発生しました: ' + error);
                });
            }

            // エラー表示をクリア
            function clearError() {
                clearTimeout(errorHideTimer);
                if (!uploadError) return;
                uploadError.hidden = true;
                uploadError.style.display = 'none';
                uploadError.textContent = '';
            }

            // エラー表示 (#uploadStatus を破壊せず専用の #uploadError に表示する)
            function showError(message) {
                clearTimeout(statusHideTimer);
                clearTimeout(errorHideTimer);
                uploadStatus.style.display = 'none';

                if (!uploadError) return;
                uploadError.textContent = message;
                uploadError.hidden = false;
                uploadError.style.display = '';

                // 5 秒後にエラーを非表示
                errorHideTimer = setTimeout(() => {
                    clearError();
                }, 5000);
            }
        });
    </script>
</section>
</body>
</html>
