<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>ようこそ</title>
</head>
<body>
<section layout:fragment="content">
    <h1 class="display-3" th:text="${Indextitle}"></h1>
    <div class="action-buttons">
        <a th:href="@{/Series}" class="btn btn-tonal">シリーズ一覧</a>
    </div>
    <div class="row" th:if="${articles != null and !articles.empty}">
        <div th:each="article : ${articles}">
            <div class="col">
                <article class="card">
                    <h2 class="card-title" th:text="${article.title}">タイトル</h2>
                    <div>
                        <a th:href="@{/ViewDescription/{id}(id=${article.id})}" class="card-link">詳細</a>
                        <span class="text-muted" th:text="${#dates.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                        <a th:if="${article.seriesId != null and seriesTitles != null and seriesTitles.containsKey(article.seriesId)}"
                           th:href="@{/Series/{id}(id=${article.seriesId})}"
                           class="md-chip"
                           th:text="${seriesTitles[article.seriesId]}"></a>
                    </div>
                </article>
            </div>
        </div>
    </div>
    <div class="md-empty-state" th:unless="${articles != null and !articles.empty}">
        <p>記事はありません。</p>
    </div>
</section>
</body>
</html>
