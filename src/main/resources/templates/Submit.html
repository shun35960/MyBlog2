<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title th:text="${Submit != null} ? ${Submit} : '登録完了'">登録完了</title>
</head>
<body>
<section layout:fragment="content">
    <div th:replace="~{layout/layout :: adminBar('')}"></div>

    <div class="reading-container">
        <header class="page-header">
            <div class="meta-row">
                <span class="status-pill status-pill--published">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span>保存完了</span>
                </span>
            </div>
            <h1 class="page-title" th:text="${Submit}">登録完了</h1>
        </header>

        <div class="surface-card" th:if="${savedArticle != null}">
            <div class="article-content">
                <p><strong>記事のタイトル:</strong> <span th:text="${savedArticle.title}"></span></p>
                <p><strong>記事の内容:</strong> <span th:text="${savedArticle.content}"></span></p>
            </div>
            <div class="action-bar">
                <a class="btn btn-primary" th:href="@{/Hello}">記事一覧へ戻る</a>
                <a class="btn btn-ghost"
                   th:if="${savedArticle.id != null}"
                   th:href="@{/Hello/Description/{id}(id=${savedArticle.id})}">記事詳細を見る</a>
            </div>
        </div>

        <div class="action-bar" th:if="${savedArticle == null}">
            <a class="btn btn-primary" th:href="@{/Hello}">記事一覧へ戻る</a>
        </div>
    </div>
</section>
</body>
</html>
