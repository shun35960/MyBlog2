<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Hello</title>
</head>
<body>
<section layout:fragment="content">
    <p class="display-3 mb-4" th:text="${Hellotitle}"></p>
    <div class="action-buttons">
        <a th:href="@{/Hello/Edit}" class="btn">新規作成</a>
        <a th:href="@{/Hello/Draft}" class="btn">下書き一覧</a>
        <a th:href="@{/Hello/Series}" class="btn">シリーズ一覧</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-danger">ログアウト</button>
        </form>
    </div>
    <div class="row" th:if="${articles != null and !articles.empty}">
        <div th:each="article : ${articles}">
            <div class="col">
                <div class="card">
                    <h5 class="card-title" th:text="${article.title}">タイトル</h5>
                    <div>
                        <a th:href="@{/Hello/Description/{id}(id=${article.id})}" class="card-link">詳細</a>
                        <span class="text-muted" th:text="${#dates.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                        <a th:if="${article.seriesId != null and seriesTitles != null and seriesTitles.containsKey(article.seriesId)}"
                           th:href="@{/Hello/Series/{id}(id=${article.seriesId})}"
                           class="badge bg-secondary text-decoration-none"
                           th:text="${seriesTitles[article.seriesId]}"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:unless="${articles != null and !articles.empty}">
        <p>記事はありません。</p>
    </div>
</section>
</body>
</html>
