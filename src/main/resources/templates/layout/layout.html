<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 既定はシステム設定に従う。ユーザーが上書きした場合だけ light / dark を入れる -->
    <meta name="color-scheme" content="light dark">
    <!-- 保存済みの上書き設定を描画前に反映してちらつきを防ぐ (この処理だけに留める) -->
    <script>
        try {
            var storedScheme = localStorage.getItem('theme');
            if (storedScheme === 'light' || storedScheme === 'dark') {
                document.querySelector('meta[name="color-scheme"]').content = storedScheme;
            }
        } catch (e) {
            /* localStorage が使えない環境ではシステム設定に従う */
        }
    </script>
    <meta name="theme-color" content="#eff0f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1b1e28" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/material-style.css}">
    <title>Hello</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7XX1D2BR7N"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-7XX1D2BR7N');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1118296000139363"
            crossorigin="anonymous"></script>

</head>
<body>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/index.js}"></script>
<header class="header" id="appBar">
    <nav class="navbar" aria-label="メインナビゲーション">
        <div class="container">
            <div class="md-top-app-bar">
                <a class="navbar-brand" th:href="@{/}">トップページ</a>
                <a class="nav-link" th:href="@{/about}">About</a>
                <button id="darkModeToggle" class="md-icon-button dark-mode-toggle md-spacer" type="button">
                    <!-- 表示中の配色に応じて片方だけを CSS で残す (JS なしでもシステム設定の変化に追従する) -->
                    <span class="visually-hidden if-light">ダークモードに切り替え</span>
                    <span class="visually-hidden if-dark">ライトモードに切り替え</span>
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>
</header>
<main class="container">
    <section layout:fragment="content"></section>
</main>
<footer class="footer">
    <div class="container">
        <span>© ベテランペーパードライバー</span>
        <a th:href="@{/privacy}">プライバシーポリシー</a>
    </div>
</footer>
<!-- 削除などの確認ダイアログ (index.js の confirmDialog() から開く) -->
<dialog id="confirmDialog" class="md-dialog" aria-labelledby="confirmDialogTitle"
        aria-describedby="confirmDialogDetail">
    <form method="dialog">
        <h2 id="confirmDialogTitle" class="md-dialog-title">確認</h2>
        <p id="confirmDialogDetail" class="md-dialog-detail" hidden></p>
        <div class="md-dialog-actions">
            <!-- 破壊的操作の確認なので、安全な「キャンセル」に初期フォーカスを置く -->
            <button type="submit" value="cancel" class="btn btn-text" autofocus>キャンセル</button>
            <button type="submit" value="confirm" class="btn btn-danger">削除</button>
        </div>
    </form>
</dialog>
</body>
</html>
