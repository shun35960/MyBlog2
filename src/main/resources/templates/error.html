<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>エラー</title>
</head>
<body>
<section layout:fragment="content">
    <!-- GlobalExceptionHandler 経由では errorTitle / errorMessage が、
         Spring Boot 既定の /error 経由では status / error が入る。両方に対応する -->
    <h1 class="display-3"
        th:with="statusText=${status != null ? status + ' ' + error : 'エラーが発生しました'}"
        th:text="${errorTitle} ?: ${statusText}">エラーが発生しました</h1>
    <div class="md-empty-state">
        <p th:text="${errorMessage} ?: '申し訳ございません。ページを表示できませんでした'">申し訳ございません。ページを表示できませんでした</p>
    </div>
    <div class="action-buttons">
        <a th:href="@{/}" class="btn btn-primary">トップページに戻る</a>
    </div>
</section>
</body>
</html>
