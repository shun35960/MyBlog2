<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title th:text="${SeriesListTitle}">シリーズ管理</title>
</head>
<body>
<section layout:fragment="content">
    <div th:replace="~{layout/layout :: adminBar('series')}"></div>

    <header class="page-header">
        <div class="page-header-row">
            <h1 class="page-title" th:text="${SeriesListTitle}">シリーズ一覧</h1>
            <span class="chip-static" th:if="${seriesSummaries != null}"
                  th:text="|${#lists.size(seriesSummaries)} シリーズ|"></span>
        </div>
    </header>

    <div class="card-grid" th:if="${seriesSummaries != null and !seriesSummaries.empty}">
        <article class="card" th:each="summary : ${seriesSummaries}">
            <div class="card-meta">
                <time class="meta-date"
                      th:if="${summary.series.createdAt != null}"
                      th:attr="datetime=${#dates.format(summary.series.createdAt, 'yyyy-MM-dd''T''HH:mm')}"
                      th:text="${#dates.format(summary.series.createdAt, 'yyyy-MM-dd HH:mm')}"></time>
                <span class="chip-static" th:text="|公開 ${summary.publishedCount} 記事|"></span>
            </div>

            <h2 class="card-title">
                <a class="card-link"
                   th:href="@{/Hello/Series/{id}(id=${summary.series.id})}"
                   th:text="${summary.series.title}">シリーズ名</a>
            </h2>

            <footer class="card-footer">
                <span class="card-read-hint" aria-hidden="true">シリーズを管理 →</span>
            </footer>
        </article>
    </div>

    <div class="empty-state" th:unless="${seriesSummaries != null and !seriesSummaries.empty}">
        <span class="empty-state-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
            </svg>
        </span>
        <h2 class="empty-state-title">シリーズはありません</h2>
        <p class="empty-state-text">記事の作成・編集画面で新しいシリーズを作成すると、ここに一覧表示されます。</p>
        <a class="btn btn-primary" th:href="@{/Hello/Edit}">記事を作成する</a>
    </div>
</section>
</body>
</html>
