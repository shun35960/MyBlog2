<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>シリーズ一覧</title>
</head>
<body>
<section layout:fragment="content">
    <h1 class="display-3" th:text="${SeriesListTitle}"></h1>
    <div class="action-buttons">
        <a th:href="@{/Hello}" class="btn btn-tonal">記事一覧へ戻る</a>
    </div>
    <div class="row" th:if="${seriesSummaries != null and !seriesSummaries.empty}">
        <div th:each="summary : ${seriesSummaries}">
            <div class="col">
                <article class="card">
                    <h2 class="card-title" th:text="${summary.series.title}">シリーズ名</h2>
                    <div>
                        <a th:href="@{/Hello/Series/{id}(id=${summary.series.id})}" class="card-link">読む</a>
                        <span class="md-chip" th:text="|記事数: ${summary.publishedCount}|"></span>
                        <span class="text-muted"
                              th:text="${#dates.format(summary.series.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>
                </article>
            </div>
        </div>
    </div>
    <div class="md-empty-state" th:unless="${seriesSummaries != null and !seriesSummaries.empty}">
        <p>シリーズはありません。</p>
    </div>
</section>
</body>
</html>
