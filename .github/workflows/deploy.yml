name: MyBlog CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# ✅ 追加: GitHub Actions の権限設定
permissions:
  contents: read          # リポジトリの内容を読む
  checks: write          # チェック結果を作成/更新
  pull-requests: write   # プルリクエストにコメント
  actions: read          # アクションの情報を読む
  statuses: write        # ステータスチェックを書き込み

env:
  APP_NAME: myblog

jobs:
  # ======== テスト・品質チェック ========
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --info

      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Gradle Tests
          path: build/test-results/test/*.xml
          reporter: java-junit
          # ✅ 追加: 明示的にトークンを指定
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/

  # ======== セキュリティスキャン ========
  # セキュリティスキャンジョブの修正
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build application
        run: ./gradlew build -x test --no-daemon

      - name: Build Docker image for scanning
        run: docker build -t myblog:security-scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'myblog:security-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'

      # GitHubのCode Scanningを使わずにアーティファクトとして保存
      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-scan-results
          path: trivy-results.sarif
          retention-days: 30

      # オプション: テキスト形式でも出力
      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'myblog:security-scan'
          format: 'table'
  # ======== 本番環境デプロイ ========
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [ test, security ]
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync to production directory
        run: |
          echo "🚀 Starting local deployment"
          
          # 本番ディレクトリが存在することを確認
          if [ ! -d "/home/shun-sv/IdeaProjects" ]; then
            echo "Creating production directory..."
            mkdir -p /home/shun-sv/IdeaProjects
          fi
          
          # 現在の作業ディレクトリからファイルを本番ディレクトリにコピー
          echo "📂 Syncing files to production directory..."
          rsync -av --delete \
            --exclude='.git' \
            --exclude='actions-runner' \
            --exclude='logs' \
            --exclude='uploads' \
            ./ /home/shun-sv/IdeaProjects/
          
          # 本番ディレクトリに移動してデプロイ実行
          cd /home/shun-sv/IdeaProjects
          
          echo "📋 Files in production directory:"
          ls -la
          
          # deploy.shの実行権限を確認
          if [ -f "./deploy.sh" ]; then
            chmod +x ./deploy.sh
            echo "🚀 Running deployment script..."
            ./deploy.sh deploy
          else
            echo "❌ deploy.sh not found in production directory"
            exit 1
          fi
  # ======== 通知 ========
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [ deploy ]
    if: always()

    steps:
      - name: Notify success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Application URL: http://192.168.10.106"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

      - name: Notify failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "🔍 Check the logs for details"

      - name: Create deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: http://192.168.10.106" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ **Deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed. Please check the logs.**" >> $GITHUB_STEP_SUMMARY
          fi