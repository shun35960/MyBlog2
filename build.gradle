plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.2'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// Spring Boot 4.1.1 の BOM が管理する Tomcat 11.0.24 には CRITICAL の脆弱性があり、
// Trivy スキャン(publish ジョブ)が失敗する。修正版の 11.0.25 へ上書きする。
// - CVE-2026-65182 アクセス制御不備によるセキュリティ制約のバイパス
// - CVE-2026-65905 DIGEST 認証のリプレイ攻撃による認証バイパス
// - CVE-2026-68525 FORM 認証のバイパスによる不正なリソースアクセス
// Boot の BOM が 11.0.25 以上を管理するようになったら、この行は削除してよい。
ext['tomcat.version'] = '11.0.25'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
    testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo.spring4x:4.33.0'
    implementation 'org.webjars:bootstrap:5.3.0'
    implementation 'org.webjars:webjars-locator-lite'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.4.0'
    implementation 'com.vladsch.flexmark:flexmark-all:0.64.8'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation "com.webauthn4j:webauthn4j-core:0.29.2.RELEASE"
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20220608.1'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'com.auth0:jwks-rsa:0.22.1'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
}

// コードの書式を揃えるための設定。
// 違反があると check(build) タスクが失敗する。./gradlew spotlessApply で自動修正できる。
// google-java-format のような全体整形は行わず、書式の揺れだけを潰す軽量な構成にしている。
spotless {
    java {
        target 'src/*/java/**/*.java'

        // 空白まわりの揺れを潰す
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()

        // import の並びと不要 import。
        // 既定の removeUnusedImports() は google-java-format を使い JDK 16 以降で
        // --add-exports が必要になるため、JavaParser ベースの実装を明示する。
        removeUnusedImports('cleanthat-javaparser-unnecessaryimport')
        importOrder('java', 'javax', 'jakarta', '', 'com.example.MyBlog')
    }
}
